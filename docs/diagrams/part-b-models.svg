<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      text { font-family: "Noto Sans Thai", "Tahoma", "Arial", sans-serif; fill: #172033; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #536078; }
      .section { font-size: 24px; font-weight: 700; fill: #a15c00; }
      .box-title { font-size: 21px; font-weight: 700; }
      .box-text { font-size: 16px; fill: #44506a; }
      .label { font-size: 15px; font-weight: 600; fill: #44506a; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 9 7; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10203a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#f7f9fc"/>
  <text x="800" y="58" text-anchor="middle" class="title">OrderBuddy — Part B Models</text>
  <text x="800" y="90" text-anchor="middle" class="subtitle">Router, model choice, validation and retry · app/router.py · app/checks.py · prompts @v2</text>

  <!-- ============================================================ 1 ROUTE -->
  <rect x="50" y="125" width="900" height="430" rx="26" fill="#fff7e8" stroke="#f59e0b" stroke-width="4"/>
  <text x="85" y="170" class="section">1 · ROUTE — classify()</text>
  <text x="85" y="198" class="box-text">newest message → RouteResult {intent, complexity} · never raises</text>

  <g filter="url(#shadow)">
    <rect x="85" y="240" width="180" height="95" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="305" y="240" width="230" height="95" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="305" y="400" width="230" height="110" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="610" y="240" width="300" height="120" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="610" y="410" width="300" height="100" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3" stroke-dasharray="9 7"/>
  </g>
  <text x="175" y="280" text-anchor="middle" class="box-title">Text message</text>
  <text x="175" y="308" text-anchor="middle" class="box-text">photo skips router</text>

  <text x="420" y="278" text-anchor="middle" class="box-title">Rules (code)</text>
  <text x="420" y="304" text-anchor="middle" class="box-text">whole-message match</text>
  <text x="420" y="324" text-anchor="middle" class="box-text">ยืนยัน · ยกเลิก · สวัสดี</text>

  <text x="420" y="438" text-anchor="middle" class="box-title">Router model</text>
  <text x="420" y="464" text-anchor="middle" class="box-text">qwen3:4b · route@v2</text>
  <text x="420" y="488" text-anchor="middle" class="box-text">schema + repair ×2</text>

  <text x="760" y="278" text-anchor="middle" class="box-title">Guard (code)</text>
  <text x="760" y="306" text-anchor="middle" class="box-text">ยกเลิกชาเย็น → modify, not cancel</text>
  <text x="760" y="330" text-anchor="middle" class="box-text">complex: ≥4 items · ถ้า · change</text>

  <text x="760" y="450" text-anchor="middle" class="box-title">Keyword fallback</text>
  <text x="760" y="478" text-anchor="middle" class="box-text">model invalid or Ollama down</text>

  <path class="arrow" d="M265 287 H305"/>
  <path class="arrow" d="M535 270 H610"/>
  <text x="572" y="260" text-anchor="middle" class="label">match</text>
  <path class="arrow" d="M420 335 V400"/>
  <text x="432" y="374" class="label">no match</text>
  <path class="arrow" d="M535 435 H570 V330 H610"/>
  <text x="582" y="390" class="label">valid</text>
  <path class="arrow dash" d="M535 480 H610"/>
  <text x="572" y="502" text-anchor="middle" class="label">invalid</text>
  <path class="arrow" d="M760 410 V360"/>

  <!-- ====================================================== 2 PICK PROFILE -->
  <rect x="990" y="125" width="560" height="430" rx="26" fill="#fff7e8" stroke="#f59e0b" stroke-width="4"/>
  <text x="1025" y="170" class="section">2 · PICK PROFILE</text>
  <text x="1025" y="198" class="box-text">code picks the profile; config.yaml holds the model</text>

  <g filter="url(#shadow)">
    <rect x="1030" y="305" width="200" height="120" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="1290" y="225" width="225" height="80" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="1290" y="325" width="225" height="80" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="1290" y="425" width="225" height="80" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
  </g>
  <text x="1130" y="350" text-anchor="middle" class="box-title">pick_profile</text>
  <text x="1130" y="378" text-anchor="middle" class="box-text">route + has_image</text>
  <text x="1130" y="400" text-anchor="middle" class="box-text">extract@v2</text>
  <text x="1030" y="470" class="box-text">modify_order alone</text>
  <text x="1030" y="492" class="box-text">no longer forces 8B</text>

  <text x="1402" y="258" text-anchor="middle" class="box-title">Vision</text>
  <text x="1402" y="284" text-anchor="middle" class="box-text">gemma3:4b · photo</text>
  <text x="1402" y="358" text-anchor="middle" class="box-title">Reasoning</text>
  <text x="1402" y="384" text-anchor="middle" class="box-text">qwen3:8b · complex</text>
  <text x="1402" y="458" text-anchor="middle" class="box-title">Fast</text>
  <text x="1402" y="484" text-anchor="middle" class="box-text">qwen3:4b · simple</text>

  <path class="arrow" d="M910 300 C960 300 980 365 1030 365"/>
  <text x="950" y="288" text-anchor="middle" class="label">route</text>
  <path class="arrow" d="M1230 365 C1260 365 1260 265 1290 265"/>
  <path class="arrow" d="M1230 365 H1290"/>
  <path class="arrow" d="M1230 365 C1260 365 1260 465 1290 465"/>

  <!-- ================================================== 3 VALIDATE & RETRY -->
  <path class="arrow" d="M1402 505 V575 H185 V695"/>

  <rect x="50" y="595" width="1500" height="370" rx="26" fill="#fff7e8" stroke="#f59e0b" stroke-width="4"/>
  <text x="85" y="640" class="section">3 · VALIDATE &amp; RETRY — ask_structured() + app/checks.py</text>
  <text x="85" y="668" class="box-text">invalid output is never executed</text>

  <g filter="url(#shadow)">
    <rect x="85" y="695" width="200" height="110" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="325" y="695" width="230" height="110" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="595" y="695" width="290" height="110" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="925" y="695" width="230" height="110" rx="18" fill="#effcf5" stroke="#10b981" stroke-width="3"/>
    <rect x="325" y="850" width="230" height="80" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="595" y="850" width="290" height="80" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="925" y="850" width="230" height="80" rx="18" fill="#fdecec" stroke="#ef4444" stroke-width="3"/>
    <rect x="1195" y="695" width="320" height="235" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3" stroke-dasharray="9 7"/>
  </g>
  <text x="185" y="735" text-anchor="middle" class="box-title">Model output</text>
  <text x="185" y="763" text-anchor="middle" class="box-text">JSON from the</text>
  <text x="185" y="785" text-anchor="middle" class="box-text">chosen profile</text>

  <text x="440" y="735" text-anchor="middle" class="box-title">Schema check</text>
  <text x="440" y="763" text-anchor="middle" class="box-text">Pydantic</text>
  <text x="440" y="785" text-anchor="middle" class="box-text">extra="forbid"</text>

  <text x="740" y="735" text-anchor="middle" class="box-title">Domain check</text>
  <text x="740" y="763" text-anchor="middle" class="box-text">extract_check: ≤15 lines,</text>
  <text x="740" y="785" text-anchor="middle" class="box-text">phone must come from customer</text>

  <text x="1040" y="735" text-anchor="middle" class="box-title">Valid</text>
  <text x="1040" y="763" text-anchor="middle" class="box-text">→ RESOLVE</text>
  <text x="1040" y="785" text-anchor="middle" class="box-text">(Part C tools)</text>

  <text x="440" y="884" text-anchor="middle" class="box-title">Repair ×2</text>
  <text x="440" y="910" text-anchor="middle" class="box-text">send the error back</text>
  <text x="740" y="884" text-anchor="middle" class="box-title">Escalate</text>
  <text x="740" y="910" text-anchor="middle" class="box-text">fast → reasoning, try again</text>
  <text x="1040" y="884" text-anchor="middle" class="box-title">Safe failure</text>
  <text x="1040" y="910" text-anchor="middle" class="box-text">CLARIFY: "ไม่เข้าใจ"</text>

  <text x="1355" y="735" text-anchor="middle" class="box-title">Reply guard</text>
  <text x="1355" y="763" text-anchor="middle" class="box-text">clean_reply() · clarify / answer</text>
  <text x="1230" y="800" class="box-text">• strip &lt;think&gt;</text>
  <text x="1230" y="828" class="box-text">• no invented "... บาท"</text>
  <text x="1230" y="856" class="box-text">• always ends with ครับ</text>
  <text x="1230" y="884" class="box-text">• else → template text</text>

  <path class="arrow" d="M285 750 H325"/>
  <path class="arrow" d="M555 750 H595"/>
  <text x="575" y="740" text-anchor="middle" class="label">ok</text>
  <path class="arrow" d="M885 750 H925"/>
  <text x="905" y="740" text-anchor="middle" class="label">ok</text>
  <path class="arrow dash" d="M440 805 V850"/>
  <text x="452" y="834" class="label">invalid</text>
  <path class="arrow dash" d="M680 805 C680 830 520 826 520 850"/>
  <path class="arrow dash" d="M325 890 H185 V805"/>
  <text x="255" y="880" text-anchor="middle" class="label">retry</text>
  <path class="arrow dash" d="M555 890 H595"/>
  <path class="arrow dash" d="M885 890 H925"/>

  <text x="800" y="988" text-anchor="middle" class="label">Code has the last word: rules, guards and checks re-check every model answer; money and stock stay in Part C tools.</text>
</svg>
