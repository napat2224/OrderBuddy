<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      text { font-family: "Noto Sans Thai", "Tahoma", "Arial", sans-serif; fill: #172033; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #536078; }
      .section { font-size: 24px; font-weight: 700; }
      .box-title { font-size: 21px; font-weight: 700; }
      .box-text { font-size: 16px; fill: #44506a; }
      .label { font-size: 15px; font-weight: 600; fill: #44506a; }
      svg &gt; path { fill: none; }
      .arrow { stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 9 7; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10203a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#f7f9fc"/>
  <text x="800" y="58" text-anchor="middle" class="title">OrderBuddy — Part A Architecture</text>
  <text x="800" y="90" text-anchor="middle" class="subtitle">LINE, State Machine, Models, Tools and JSON Storage</text>

  <!-- Entry flow -->
  <g filter="url(#shadow)">
    <rect x="55" y="145" width="190" height="100" rx="20" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>
    <rect x="285" y="145" width="190" height="100" rx="20" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>
    <rect x="515" y="145" width="220" height="100" rx="20" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>
    <rect x="785" y="135" width="300" height="120" rx="20" fill="#e9f2ff" stroke="#2563eb" stroke-width="4"/>
  </g>
  <text x="150" y="187" text-anchor="middle" class="box-title">Customer</text>
  <text x="150" y="216" text-anchor="middle" class="box-text">Text / Image</text>
  <text x="380" y="187" text-anchor="middle" class="box-title">LINE API</text>
  <text x="380" y="216" text-anchor="middle" class="box-text">Webhook + Push</text>
  <text x="625" y="187" text-anchor="middle" class="box-title">FastAPI</text>
  <text x="625" y="216" text-anchor="middle" class="box-text">app/main.py</text>
  <text x="935" y="183" text-anchor="middle" class="box-title">OrderAgent + State Machine</text>
  <text x="935" y="213" text-anchor="middle" class="box-text">Controls flow, state, permissions</text>
  <text x="935" y="237" text-anchor="middle" class="box-text">app/state_machine.py</text>
  <text x="265" y="205" text-anchor="middle" class="box-title">→</text>
  <text x="495" y="205" text-anchor="middle" class="box-title">→</text>
  <text x="760" y="205" text-anchor="middle" class="box-title">→</text>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M245 195 H285"/>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M475 195 H515"/>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M735 195 H785"/>

  <!-- Part B -->
  <rect x="70" y="335" width="700" height="465" rx="26" fill="#fff7e8" stroke="#f59e0b" stroke-width="4"/>
  <text x="105" y="380" class="section" fill="#a15c00">PART B — MODELS (Fluke)</text>
  <text x="105" y="410" class="box-text">Understand input, select a model, return structured JSON</text>

  <g filter="url(#shadow)">
    <rect x="115" y="455" width="255" height="105" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="470" y="455" width="255" height="105" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="105" y="640" width="180" height="100" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="330" y="640" width="180" height="100" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="555" y="640" width="180" height="100" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
  </g>
  <text x="242" y="496" text-anchor="middle" class="box-title">Router</text>
  <text x="242" y="525" text-anchor="middle" class="box-text">intent + complexity</text>
  <text x="597" y="496" text-anchor="middle" class="box-title">Validation / Retry</text>
  <text x="597" y="525" text-anchor="middle" class="box-text">Pydantic + repair + fallback</text>
  <text x="195" y="680" text-anchor="middle" class="box-title">Fast</text>
  <text x="195" y="708" text-anchor="middle" class="box-text">qwen3:4b</text>
  <text x="420" y="680" text-anchor="middle" class="box-title">Reasoning</text>
  <text x="420" y="708" text-anchor="middle" class="box-text">qwen3:8b</text>
  <text x="645" y="680" text-anchor="middle" class="box-title">Vision</text>
  <text x="645" y="708" text-anchor="middle" class="box-text">gemma3:4b</text>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M860 255 C790 305 360 320 245 455"/>
  <text x="530" y="310" class="label">route / extract</text>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M370 507 H470"/>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M242 560 C242 600 195 600 195 640"/>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M242 560 C242 600 420 600 420 640"/>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M242 560 C242 600 645 600 645 640"/>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M195 640 C195 590 520 590 560 560"/>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M420 640 V570"/>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M645 640 V570"/>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M725 507 C810 475 830 330 930 255"/>
  <text x="782" y="432" class="label">ExtractedOrder</text>

  <!-- Part C -->
  <rect x="830" y="335" width="700" height="465" rx="26" fill="#effcf5" stroke="#10b981" stroke-width="4"/>
  <text x="865" y="380" class="section" fill="#057654">PART C — TOOLS &amp; DATA (Beam)</text>
  <text x="865" y="410" class="box-text">Search menu, check stock, price, address and manage draft</text>

  <g filter="url(#shadow)">
    <rect x="870" y="455" width="195" height="90" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    <rect x="1090" y="455" width="195" height="90" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    <rect x="1310" y="455" width="180" height="90" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    <rect x="925" y="590" width="240" height="90" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    <rect x="1195" y="590" width="260" height="90" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    <rect x="1040" y="720" width="320" height="65" rx="16" fill="#dbf7e9" stroke="#10b981" stroke-width="3"/>
  </g>
  <text x="968" y="495" text-anchor="middle" class="box-title">product_search</text>
  <text x="968" y="520" text-anchor="middle" class="box-text">read / model + code</text>
  <text x="1188" y="495" text-anchor="middle" class="box-title">stock_checker</text>
  <text x="1188" y="520" text-anchor="middle" class="box-text">read / model + code</text>
  <text x="1400" y="495" text-anchor="middle" class="box-title">price_calculator</text>
  <text x="1400" y="520" text-anchor="middle" class="box-text">read / code only</text>
  <text x="1045" y="630" text-anchor="middle" class="box-title">address_validator</text>
  <text x="1045" y="655" text-anchor="middle" class="box-text">read / code only</text>
  <text x="1325" y="630" text-anchor="middle" class="box-title">draft_order_manager</text>
  <text x="1325" y="655" text-anchor="middle" class="box-text">write / DONE or cancel only</text>
  <text x="1200" y="760" text-anchor="middle" class="box-title">catalog.json · stock.json · shop.json</text>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M1085 235 C1110 310 1100 380 1060 455"/>
  <text x="1110" y="320" class="label">tool calls</text>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M968 545 L1115 720"/>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M1188 545 L1190 720"/>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M1400 545 L1285 720"/>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M1045 680 L1120 720"/>

  <!-- Storage / staff -->
  <rect x="70" y="850" width="1460" height="105" rx="24" fill="#f0edff" stroke="#7c3aed" stroke-width="4"/>
  <text x="105" y="890" class="section" fill="#6432bd">PART A — CONTRACTS &amp; STORAGE (Prem)</text>
  <text x="105" y="925" class="box-text">Pydantic Schemas</text>
  <text x="330" y="925" class="box-text">SessionStore</text>
  <text x="520" y="925" class="box-text">drafts/*.json</text>
  <text x="730" y="925" class="box-text">sessions/*.json</text>
  <text x="950" y="925" class="box-text">orders/*.json</text>
  <text x="1140" y="925" class="box-text">Staff approve / reject</text>
  <text x="1500" y="925" text-anchor="end" class="box-text">Deduct stock after approval</text>
  <path fill="none" d="M935 255 C930 700 760 740 760 850" class="arrow dash"/>
  <path fill="none" d="M1325 680 C1325 760 1110 790 1040 850" class="arrow dash"/>
</svg>
