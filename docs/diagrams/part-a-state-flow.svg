<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="620" viewBox="0 0 1800 620">
  <defs>
    <style>
      text { font-family: "Noto Sans Thai", "Tahoma", "Arial", sans-serif; fill: #172033; }
      .title { font-size: 36px; font-weight: 700; }
      .sub { font-size: 18px; fill: #526078; }
      .state { font-size: 20px; font-weight: 700; }
      .note { font-size: 15px; fill: #526078; }
      svg &gt; path { fill: none; }
      .arrow { stroke: #64748b; stroke-width: 3; marker-end: url(#a); }
    </style>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#64748b"/></marker>
    <filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1800" height="620" fill="#f7f9fc"/>
  <text x="900" y="55" text-anchor="middle" class="title">OrderBuddy — State Machine Flow</text>
  <text x="900" y="87" text-anchor="middle" class="sub">How one customer message becomes a validated FinalOrder</text>

  <g filter="url(#s)" stroke-width="3">
    <rect x="35" y="180" width="145" height="85" rx="18" fill="#fff" stroke="#64748b"/>
    <rect x="220" y="180" width="145" height="85" rx="18" fill="#e9f2ff" stroke="#2563eb"/>
    <rect x="405" y="180" width="145" height="85" rx="18" fill="#fff7e8" stroke="#f59e0b"/>
    <rect x="590" y="180" width="145" height="85" rx="18" fill="#fff7e8" stroke="#f59e0b"/>
    <rect x="775" y="180" width="145" height="85" rx="18" fill="#effcf5" stroke="#10b981"/>
    <rect x="960" y="180" width="145" height="85" rx="18" fill="#effcf5" stroke="#10b981"/>
    <rect x="1145" y="180" width="145" height="85" rx="18" fill="#f0edff" stroke="#7c3aed"/>
    <rect x="1330" y="180" width="145" height="85" rx="18" fill="#f0edff" stroke="#7c3aed"/>
    <rect x="1515" y="180" width="240" height="85" rx="18" fill="#e8f7ef" stroke="#059669"/>
    <rect x="555" y="410" width="190" height="85" rx="18" fill="#fff1f2" stroke="#e11d48"/>
    <rect x="985" y="410" width="190" height="85" rx="18" fill="#fff1f2" stroke="#e11d48"/>
  </g>

  <text x="107" y="230" text-anchor="middle" class="state">IDLE</text>
  <text x="292" y="230" text-anchor="middle" class="state">ROUTE</text>
  <text x="477" y="230" text-anchor="middle" class="state">EXTRACT</text>
  <text x="662" y="230" text-anchor="middle" class="state">RESOLVE</text>
  <text x="847" y="230" text-anchor="middle" class="state">PRICE</text>
  <text x="1032" y="230" text-anchor="middle" class="state">ADDRESS</text>
  <text x="1217" y="230" text-anchor="middle" class="state">CONFIRM</text>
  <text x="1402" y="230" text-anchor="middle" class="state">DONE</text>
  <text x="1635" y="230" text-anchor="middle" class="state">STAFF_REVIEW</text>
  <text x="200" y="232" text-anchor="middle" class="state">→</text>
  <text x="385" y="232" text-anchor="middle" class="state">→</text>
  <text x="570" y="232" text-anchor="middle" class="state">→</text>
  <text x="755" y="232" text-anchor="middle" class="state">→</text>
  <text x="940" y="232" text-anchor="middle" class="state">→</text>
  <text x="1125" y="232" text-anchor="middle" class="state">→</text>
  <text x="1310" y="232" text-anchor="middle" class="state">→</text>
  <text x="1495" y="232" text-anchor="middle" class="state">→</text>
  <text x="650" y="460" text-anchor="middle" class="state">CLARIFY</text>
  <text x="1080" y="460" text-anchor="middle" class="state">ERROR</text>

  <path fill="none" stroke="#64748b" stroke-width="3" d="M180 222 H220"/><path fill="none" stroke="#64748b" stroke-width="3" d="M365 222 H405"/><path fill="none" stroke="#64748b" stroke-width="3" d="M550 222 H590"/>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M735 222 H775"/><path fill="none" stroke="#64748b" stroke-width="3" d="M920 222 H960"/><path fill="none" stroke="#64748b" stroke-width="3" d="M1105 222 H1145"/>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M1290 222 H1330"/><path fill="none" stroke="#64748b" stroke-width="3" d="M1475 222 H1515"/>

  <text x="198" y="165" text-anchor="middle" class="note">message / image</text>
  <text x="385" y="165" text-anchor="middle" class="note">order intent</text>
  <text x="570" y="165" text-anchor="middle" class="note">valid JSON</text>
  <text x="755" y="165" text-anchor="middle" class="note">valid SKU</text>
  <text x="940" y="165" text-anchor="middle" class="note">code computes</text>
  <text x="1125" y="165" text-anchor="middle" class="note">complete</text>
  <text x="1310" y="165" text-anchor="middle" class="note">new confirm message</text>
  <text x="1495" y="165" text-anchor="middle" class="note">save order</text>

  <path fill="none" stroke="#64748b" stroke-width="3" d="M477 265 C477 345 600 330 620 410"/>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M662 265 V410"/>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M1032 265 C1032 340 720 340 690 410"/>
  <text x="560" y="360" class="note">Missing data / unknown item / out of stock</text>
  <path fill="none" stroke="#64748b" stroke-width="3" d="M555 452 C350 452 290 350 290 265"/>
  <text x="310" y="432" class="note">Customer provides more information</text>

  <path fill="none" stroke="#64748b" stroke-width="3" d="M1080 410 C1080 330 900 330 900 265"/>
  <text x="1100" y="355" class="note">exception → safe customer message</text>

  <path fill="none" stroke="#64748b" stroke-width="3" d="M1217 180 C1217 110 292 110 292 180"/>
  <text x="755" y="122" text-anchor="middle" class="note">Order modification returns to ROUTE and runs the flow again</text>

  <text x="900" y="565" text-anchor="middle" class="sub">Safety gate: previous state CONFIRM + no missing fields + newest intent confirm</text>
</svg>
